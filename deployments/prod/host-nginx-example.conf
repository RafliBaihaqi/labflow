# Host nginx example for labflow
# Place at: /etc/nginx/sites-available/labflow
# Then: sudo ln -s /etc/nginx/sites-available/labflow /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Backend is at 127.0.0.1:8080, Frontend at 127.0.0.1:3000 (see docker-compose.yml)
# This proxies /api and /auth to backend, everything else to frontend.
# Works with HTTP; for HTTPS run: sudo certbot --nginx -d your-domain.com

# --- Upstreams (optional, but cleaner) ---
upstream labflow_backend {
    server 127.0.0.1:8080;
}

upstream labflow_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # <-- CHANGE to your domain or VPS IP

    # Logs
    access_log /var/log/nginx/labflow.access.log;
    error_log /var/log/nginx/labflow.error.log warn;

    # Uploads (sample photos, certificates, avatars) - same as old prod stack
    client_max_body_size 50M;
    client_body_timeout 30s;

    # Backend API - /api/ -> backend:8080/api/
    location /api/ {
        proxy_pass http://labflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Auth - /auth/ -> backend:8080/auth/
    location /auth/ {
        proxy_pass http://labflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check direct (optional, for monitoring)
    location = /health {
        proxy_pass http://labflow_backend/health;
        access_log off;
    }

    # Frontend - everything else -> frontend:3000
    location / {
        proxy_pass http://labflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Optional: cache static assets aggressively (React Router build outputs)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://labflow_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# --- After you have HTTP working, enable HTTPS with certbot: ---
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d your-domain.com
#
# Certbot will automatically add the 443 server block with certificates and redirect.
# If you prefer manual, duplicate the server block above with:
#   listen 443 ssl http2;
#   ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#   and add HSTS headers.
