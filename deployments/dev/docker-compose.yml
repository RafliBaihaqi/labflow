# Dev infrastructure only — run the backend (go run) and frontend (npm run dev) on the host.
# Ports are bound to 127.0.0.1 so nothing is exposed beyond your machine.
# Container names and volumes are prefixed "dev" to avoid clashing with the prod stack.

services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-database}
      POSTGRES_DB: ${POSTGRES_DB:-labflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-labflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: labflow-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. SeaweedFS replaces MinIO: the minio/minio and
  # minio/mc images are no longer published. The backend creates its buckets on startup.
  s3:
    image: chrislusf/seaweedfs:3.97
    container_name: labflow-dev-s3
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - dev_s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_s3_data:
