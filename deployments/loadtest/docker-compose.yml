# Self-contained stack for load testing and e2e: app + Prometheus + Grafana.
#   docker compose -f deployments/loadtest/docker-compose.yml up -d --build
#   docker compose -f deployments/loadtest/docker-compose.yml run --rm backend seed
# Grafana: http://localhost:3001 (anonymous viewer) · Prometheus: http://localhost:9090
# Not for production: rate limiting is disabled and secrets are throwaway.

x-backend-env: &backend-env
  ENV: loadtest
  DATABASE_URL: postgres://labflow:labflow@postgres:5432/labflow?sslmode=disable
  MIGRATIONS_URL: postgres://labflow:labflow@postgres:5432/labflow?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: s3:9000
  MINIO_ACCESS: minioadmin
  MINIO_SECRET: minioadmin
  JWT_SECRET: loadtest-jwt-secret-not-for-production-use
  COOKIE_SECRET: loadtest-cookie-secret-not-for-production
  BYPASS_TURNSTILE: "true"
  DISABLE_RATE_LIMIT: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labflow
      POSTGRES_PASSWORD: labflow
      POSTGRES_DB: labflow
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labflow -d labflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object store (MinIO no longer publishes images to Docker Hub).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # The backend runs in a container under the "app" profile (CI). Locally you can
  # instead run it on the host against these same ports - see the "Performance" section of the README.
  backend:
    profiles: [app]
    build: ../../kernel
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits: { cpus: "2", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/labflow-api.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
