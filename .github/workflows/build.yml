name: Build Images

on:
  push:
    branches: [main]
    tags: ["v*", "backend-v*", "frontend-v*"]
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Custom tag for backend image (e.g., v1.2.0, backend-v1.0.0). Leave empty to use auto tags."
        required: false
        default: ""
        type: string
      frontend_tag:
        description: "Custom tag for frontend image (e.g., v1.2.0, frontend-v1.0.0). Leave empty to use auto tags."
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26.0"
  NODE_VERSION: "20"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kernel/go.sum

      - name: Go mod tidy check
        working-directory: kernel
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go vet
        working-directory: kernel
        run: go vet ./...

      - name: Go build
        working-directory: kernel
        run: go build ./...

      - name: Go test
        working-directory: kernel
        run: go test ./... -count=1 -timeout 5m

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Frontend typecheck
        working-directory: app
        run: npm run typecheck

      - name: Frontend build
        working-directory: app
        run: npm run build

  build-backend:
    needs: build-and-test
    # Skip if this is frontend-only tag push
    if: ${{ !startsWith(github.ref, 'refs/tags/frontend-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta - backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/labflow-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }},enable={{is_default_branch}}
            type=raw,value=${{ inputs.backend_tag }},enable=${{ inputs.backend_tag != '' }}
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Strip backend-v prefix for semver if tag is backend-v1.2.3
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./kernel
          file: ./kernel/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GO_VERSION=${{ env.GO_VERSION }}

  build-frontend:
    needs: build-and-test
    # Skip if this is backend-only tag push
    if: ${{ !startsWith(github.ref, 'refs/tags/backend-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta - frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/labflow-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }},enable={{is_default_branch}}
            type=raw,value=${{ inputs.frontend_tag }},enable=${{ inputs.frontend_tag != '' }}
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
